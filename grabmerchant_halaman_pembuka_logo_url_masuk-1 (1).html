<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#00B14F">
  <meta name="description" content="Kelola bisnis Anda dengan lebih mudah.">
  <title>Selamat Datang</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --grab-green: #00B14F;
      --grab-green-dark: #008A3D;
      --text-primary: #202824;
      --text-secondary: #68736D;
      --white: #FFFFFF;
      --page-bg: #F1F4F2;
      --radius-card: 30px;
      --radius-button: 18px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--page-bg);
      color: var(--text-primary);
      font-family: "Inter", sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .mobile-screen {
      position: relative;
      isolation: isolate;
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 420px;
      height: min(860px, calc(100dvh - 48px));
      min-height: 560px;
      overflow: hidden;
      border-radius: var(--radius-card);
      background: var(--white);
      box-shadow: 0 24px 70px rgba(20, 60, 35, 0.14);
    }

    .hero-section {
      position: relative;
      flex: 1.2;
      min-height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 42px 26px 58px;
      overflow: hidden;
      text-align: center;
      color: var(--white);
      background: linear-gradient(145deg, #00B14F 0%, #009C45 52%, #008A3D 100%);
    }

    .hero-section::before,
    .hero-section::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }

    .hero-section::before {
      width: 300px;
      height: 300px;
      top: -150px;
      right: -120px;
      background: rgba(255, 255, 255, 0.08);
    }

    .hero-section::after {
      width: 240px;
      height: 240px;
      bottom: -130px;
      left: -100px;
      background: rgba(255, 255, 255, 0.07);
    }

    .hero-content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fade-up 650ms ease both;
    }

    .logo-box {
      width: 148px;
      height: 148px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      border: 0;
      border-radius: 28px;
      background: transparent;
      box-shadow: none;
      backdrop-filter: none;
      overflow: hidden;
    }

    .brand-logo {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 28px;
    }

    .app-title {
      margin-bottom: 10px;
      font-size: clamp(28px, 8vw, 34px);
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: -1.5px;
    }

    .app-title span {
      font-weight: 400;
      letter-spacing: -1.2px;
    }

    .app-subtitle {
      max-width: 280px;
      font-size: 14px;
      line-height: 1.7;
      color: rgba(255, 255, 255, 0.9);
    }

    .action-section {
      position: relative;
      z-index: 2;
      flex: 0.8;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 38px 28px 34px;
      margin-top: -28px;
      border-radius: 30px 30px 0 0;
      background: var(--white);
    }

    .welcome-text {
      margin-bottom: 28px;
    }

    .welcome-text h2 {
      margin-bottom: 10px;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.7px;
    }

    .welcome-text p {
      font-size: 13px;
      line-height: 1.7;
      color: var(--text-secondary);
    }

    .button-group {
      display: flex;
      flex-direction: column;
    }

    .btn {
      width: 100%;
      min-height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px 20px;
      border: 1px solid var(--grab-green);
      border-radius: var(--radius-button);
      background: var(--grab-green);
      color: var(--white);
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      transition: background 180ms ease, box-shadow 180ms ease, transform 180ms ease;
      box-shadow: 0 8px 18px rgba(0, 177, 79, 0.18);
    }

    .btn:hover {
      background: #009D46;
      border-color: #009D46;
      box-shadow: 0 10px 24px rgba(0, 177, 79, 0.24);
      transform: translateY(-2px);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn:focus-visible {
      outline: 3px solid rgba(0, 177, 79, 0.35);
      outline-offset: 4px;
    }

    .app-footer {
      margin-top: 26px;
      text-align: center;
      font-size: 10px;
      line-height: 1.6;
      letter-spacing: 0.2px;
      color: #A0A6A2;
    }

    @keyframes fade-up {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      body {
        padding: 0;
        background: var(--white);
      }

      .mobile-screen {
        width: 100%;
        max-width: none;
        height: 100vh;
        height: 100dvh;
        min-height: 540px;
        border-radius: 0;
        box-shadow: none;
      }

      .hero-section {
        padding: 36px 24px 56px;
      }

      .action-section {
        padding: 34px 24px 28px;
      }
    }

    @media (max-height: 700px) and (min-width: 481px) {
      body {
        padding: 12px;
      }

      .mobile-screen {
        height: calc(100dvh - 24px);
        min-height: 540px;
      }

      .hero-section {
        min-height: 250px;
        padding: 26px 24px 48px;
      }

      .logo-box {
        width: 112px;
        height: 112px;
        margin-bottom: 16px;
        border-radius: 22px;
      }

      .brand-logo {
        border-radius: 22px;
      }

      .action-section {
        padding-top: 28px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
